name: taxi_al_shaheen
description: "تطبيق تكسي الشاهين للمشاوير والرحلات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # حزم الفايربيس للربط وقواعد البيانات والتسجيل
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # خرائط جوجل وتحديد الموقع
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0

  # الأيقونات
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
