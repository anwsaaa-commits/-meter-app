name: smart_taxi_meter
description: "تطبيق عداد تاكسي ذكي متكامل باللغة العربية مع حساب الأجرة عبر GPS وزر وقت الانتظار وقاعدة بيانات SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
