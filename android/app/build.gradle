android {
    namespace "com.alshaheen.taxi"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.alshaheen.taxi"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    compileOptions {
        // تفعيل الـ desugaring لدعم مكتبات فايربيز وجوجل الجديدة
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    flutter {
        source "../.."
    }
}

dependencies {
    // هذه الإضافة الضرورية لمنع خطأ Dexing / Desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
