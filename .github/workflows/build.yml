name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract project and prepare structure
        run: |
          # إذا كان المشروع مضغوطاً، سنقوم بفكه، أو إنشاء هيكل نظيف إذا لزم الأمر
          if [ -f "smart_taxi_meter_flutter.zip" ]; then
            unzip -o smart_taxi_meter_flutter.zip -d extracted_project
            cp -r extracted_project/* .
          fi
          
          # التحقق من وجود مجلد android وإنشاؤه تلقائياً إن لمש يكن موجوداً
          if [ ! -d "android" ]; then
            flutter create . --org com.example --project-name smart_taxi_meter_flutter --platforms=android
          fi

          # التأكد من مكان ملف main.dart الرئيسي
          if [ -f "main.dart" ] && [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            cp main.dart lib/main.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
